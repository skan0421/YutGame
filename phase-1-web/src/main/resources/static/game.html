<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>윷놀이 - 게임</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="game-body">
    <div class="game-container">
        <!-- 타이틀 -->
        <h1 class="game-title">윷 놀 이</h1>

        <!-- 상단: 플레이어 탭 -->
        <div class="player-tabs">
            <div class="player-tab" id="player1-info">
                <span class="player-emoji">🔴</span>
                <span class="player-name" id="p1-name">Player 1</span>
                <span class="player-score" id="p1-score">도착: 0/4</span>
            </div>
            <div class="turn-badge">
                <span id="turn-display">TURN 0</span>
                <span id="current-turn-name">대기중</span>
            </div>
            <div class="player-tab" id="player2-info">
                <span class="player-emoji">🟢</span>
                <span class="player-name" id="p2-name">Player 2</span>
                <span class="player-score" id="p2-score">도착: 0/4</span>
            </div>
        </div>

        <!-- 턴 전환 배너 -->
        <div id="turn-banner" class="turn-banner" style="display:none;">
            <span id="turn-banner-text"></span>
        </div>

        <!-- 3D 뷰포트 -->
        <div id="board-mount" class="board-viewport"></div>

        <!-- 메시지 -->
        <div class="message-bubble">
            <p id="game-message">게임을 시작합니다!</p>
        </div>

        <!-- 윷 결과 + 히스토리 -->
        <div class="result-area">
            <div id="yut-result-badge" class="yut-result-badge" style="display:none;"></div>
            <div id="throw-history" class="throw-history"></div>
        </div>

        <!-- 컨트롤 버튼 -->
        <div class="controls">
            <div id="throw-area" class="action-area">
                <button id="throw-btn" onclick="doThrowYut()">🎯 윷 던지기</button>
            </div>
            <div id="piece-area" class="action-area" style="display:none;">
                <p>이동할 말을 선택하세요:</p>
                <div id="piece-buttons"></div>
            </div>
        </div>

        <!-- 윷 던지기 애니메이션 오버레이 -->
        <div id="yut-throw-overlay" class="yut-throw-overlay" style="display:none;">
            <div class="yut-sticks-container">
                <div class="yut-stick"></div>
                <div class="yut-stick"></div>
                <div class="yut-stick"></div>
                <div class="yut-stick"></div>
            </div>
            <div class="throw-result-text" id="throw-result-text"></div>
        </div>

        <!-- 게임 오버 모달 -->
        <div id="game-over-modal" class="modal" style="display:none;">
            <div class="modal-content">
                <h2 id="winner-text">승리!</h2>
                <p id="winner-message"></p>
                <button onclick="location.href='/'">로비로 돌아가기</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="/js/board.js"></script>
    <script src="/js/game.js"></script>
</body>
</html>
